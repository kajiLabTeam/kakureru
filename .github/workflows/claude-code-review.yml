name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # DependabotのPRにはリポジトリのsecretsが渡らず(Dependabot用secretsのみ)、
    # CLAUDE_CODE_OAUTH_TOKEN が空になって毎回失敗するので対象外にする。
    if: ${{ !startsWith(github.head_ref, 'night-run/') && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"